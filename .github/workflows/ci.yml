# CI：把「本地怎么装、CI 就怎么装」固定下来。
#
# 关键点：前端安装只认 pnpm-lock.yaml（--frozen-lockfile），
# 锁文件和 package.json 对不上时 CI 直接红，而不是悄悄解析出新版本。
# 锁文件在仓库里；改依赖要连它一起提交，只改 package.json 会让安装步骤直接失败。

name: CI

on:
  # 不按分支名过滤：主干改名（master -> main）时，写成 branches: [main] 会静默不触发。
  push:
  pull_request:

# 同一分支连续提交时取消上一次运行，省 runner 也避免旧结果误导。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: go build ./...

      - name: 静态检查（go vet）
        run: go vet ./...

      # vet 查不出「写了却没人调用的包级函数」，那一层由 staticcheck 的 U1000 补。
      - name: 静态检查（staticcheck）
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # 格式漂移不影响构建，却会让编辑器每次打开都提示，久了就没人再看那条提示。
      - name: 格式检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，本地跑 gofmt -w 修掉："
            echo "$out"
            exit 1
          fi

      - name: 单元测试（含 race 检测）
        run: go test -race ./... -count=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本从 package.json 的 packageManager 读，
      # 不在这里写死版本号，避免和本地 / corepack 各说一套。
      #
      # 缓存不在这里开：setup-node v5 起会按 packageManager 字段自动接管缓存，
      # 两边同时开就是对同一个 pnpm store 抢着 restore/save。所以缓存统一交给
      # 下面的 setup-node（cache: pnpm），这里只负责装 pnpm 本身。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: 安装依赖（严格按锁文件）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建
        run: pnpm run build

  # 文档自检。这三条在本地靠人手跑，漏一次就是「文档与代码各说一套」，
  # 而且没有任何编译错误会提醒——所以放进 CI。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 码表三处行数一致
        run: |
          files="docs/contracts/api.md apps/server/AGENTS.md apps/web/AGENTS.md"
          counts=$(grep -c '^| `[0-9]' $files | awk -F: '{print $NF}' | sort -u)
          if [ "$(printf '%s\n' "$counts" | wc -l)" -ne 1 ]; then
            echo "码表行数不一致，三处（契约正本 / 后端规范 / 前端规范）必须同步："
            grep -c '^| `[0-9]' $files || true
            exit 1
          fi

      - name: apps/ 下的文档不得外链
        run: |
          if grep -rn '](\.\./' apps/ --exclude-dir=node_modules; then
            echo "apps/ 下的文档出现了指向本目录之外的链接：端级文档必须自包含"
            exit 1
          fi

      - name: apps/ 下的代码与配置不得逃出本目录
        run: |
          hits=$(grep -rn --exclude-dir=node_modules --exclude-dir=dist '\.\./\.\.' apps/ \
            --include='*.go' --include='*.ts' --include='*.tsx' \
            --include='*.yml' --include='*.yaml' --include='*.json' \
            | grep -v 'Taskfile.yml:.*VERSION' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "apps/ 下出现了 ../.. 引用；唯一允许的是 Taskfile 读 ../../VERSION"
            exit 1
          fi
