version: '3'

# 前端任务。命令只在这里维护一份：仓库根的统一入口按任务名调用本文件
# （`task -d apps/web <任务>`），本地也可以直接在本目录跑 `task <任务>`。
#
# 包管理器是 pnpm，版本由 package.json 的 packageManager 字段锁定。
# PNPM 可覆盖，便于在没把 pnpm 放进 PATH 的机器上指定绝对路径：
#   task build PNPM=/usr/local/bin/pnpm
#
# 这里没有 fmt 任务：本工程没装 prettier / eslint，格式化没有可调用的工具。
# 统一入口发现某个子项目没定义 fmt 时会跳过它，不会因此报错。
vars:
  PNPM: '{{.PNPM | default "pnpm"}}'

tasks:
  # 不带任务名时落到这里，等价于 `task help`。
  # 刻意不写 desc：description 是 --list 的筛选条件，写了它就会在**仓库根**的命令清单里
  # 多出 `web:default` 与别名 `web` 两行（`default` 是 Task 的内置名字，
  # 不是这一端对外提供的命令）。
  default:
    silent: true
    cmds:
      - task help

  help:
    desc: 列出前端可用任务（等价于直接跑 task）
    silent: true
    cmds:
      - task --list

  install:
    desc: 安装依赖（-- --ci：严格按 pnpm-lock.yaml 安装，锁文件与 package.json 不一致直接失败）
    # 参数用 env 传进来，不直接插值进 shell：值原样到达脚本，不会被二次解析。
    env:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      # 命令级 silent：这一段是脚本，回显整段没有信息量，有用的输出由 pnpm 自己给。
      - cmd: |
          set -euf
          # 参数是根目录统一入口原样转进来的，里面可能带着旁边那个子项目的开关，
          # 所以不认识的参数一律忽略，只挑出本端认的 --ci。
          # Task 会把每个参数按 shell 规则加引号后拼成一串，eval 是为了复原参数边界：
          # 含空格的参数不会被拆开，`--db=pg` 也不会带着引号进来。
          eval "set -- ${ARGS:-}"
          ci=false
          for arg in "$@"; do
            if [ "$arg" = "--ci" ]; then
              ci=true
            fi
          done
          if [ "$ci" = true ]; then
            {{.PNPM}} install --frozen-lockfile
          else
            {{.PNPM}} install
          fi
        silent: true

  dev:
    desc: 启动 Vite 开发服务器（:5173，/api 代理到 :8080）
    # 本端 dev 没有开关：根目录转进来的参数（比如后端的 --db=pg）直接忽略，不报错。
    cmds:
      - '{{.PNPM}} run dev'

  build:
    desc: 类型检查并打包
    cmds:
      - '{{.PNPM}} run build'

  lint:
    desc: 类型检查（本工程没有 eslint，tsc 这一步就是主要防线）
    cmds:
      - '{{.PNPM}} run typecheck'

  preview:
    desc: 预览打包结果
    deps: [build]
    cmds:
      - '{{.PNPM}} run preview'

  clean:
    # 只删构建产物，不动 node_modules——重装要走 install，避免误删后还要联网。
    desc: 清理构建产物 dist/
    cmds:
      - rm -rf dist
