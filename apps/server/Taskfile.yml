version: '3'

# 后端任务。命令只在这里维护一份：仓库根的统一入口按任务名调用本文件
# （`task -d apps/server <任务>`），本地也可以直接在本目录跑 `task <任务>`。
#
# 工作目录就是 apps/server，因此 go.mod、.air.toml、configs/ 的路径都相对于本目录。
# 带开关的任务要把开关放在 `--` 之后（Task 自己的参数解析不接受裸 --xxx）：
#   task dev -- --db=pg --once

vars:
  BIN_DIR: bin
  APP_NAME: app-server
  CONFIG_FILE: configs/config.yaml
  AIR_VERSION: v1.67.4
  AIR_CONFIG: .air.toml
  # staticcheck 只用 go run 拉，不进 go.mod：它是检查工具，不是运行时依赖。
  STATICCHECK_VERSION: v0.8.2
  # 本端要用到的容器都在本目录里定义：容器属于本端的开发环境，不放在仓库根。
  COMPOSE_FILE: deployments/docker-compose.yml
  # 版本号正本是仓库根目录的 VERSION.txt，构建期注入：
  # 产物因此能在任何目录用 -version 自证。命令行 task build APP_VERSION=1.2.3 可覆盖。
  #
  # 刻意不叫 VERSION：任务级变量会向上传给调用它的父 Taskfile，
  # 而根目录的 release 任务要用 VERSION 接收用户输入的版本号，同名会被覆盖。
  APP_VERSION:
    sh: tr -d '[:space:]' < ../../VERSION.txt 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  # 不带任务名时落到这里，等价于 `task help`。
  # 刻意不写 desc：description 是 --list 的筛选条件，写了它就会在**仓库根**的命令清单里
  # 多出 `server:default` 与别名 `server` 两行（`default` 是 Task 的内置名字，
  # 不是这一端对外提供的命令）。
  default:
    silent: true
    cmds:
      - task help

  help:
    desc: 列出后端可用任务（等价于直接跑 task）
    silent: true
    cmds:
      - task --list

  install:
    desc: 下载 Go 依赖并整理 go.mod（-- --ci：只按 go.mod / go.sum 下载，不改它们）
    # 参数用 env 传进来，不直接插值进 shell：值原样到达脚本，不会被二次解析。
    env:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      # 命令级 silent：这一段是脚本，回显整段没有信息量，有用的输出由脚本自己给。
      - cmd: |
          set -euf
          # 参数是根目录统一入口原样转进来的，里面可能带着旁边那个子项目的开关，
          # 所以不认识的参数一律忽略，只挑出本端认的 --ci。
          # Task 会把每个参数按 shell 规则加引号后拼成一串，eval 是为了复原参数边界：
          # 含空格的参数不会被拆开，`--db=pg` 也不会带着引号进来。
          eval "set -- ${ARGS:-}"
          ci=false
          for arg in "$@"; do
            if [ "$arg" = "--ci" ]; then
              ci=true
            fi
          done
          go mod download
          # 严格模式不多做一步 tidy：tidy 会改写 go.mod / go.sum，
          # 在 CI / 发布流程里那等于悄悄改掉了锁文件。
          if [ "$ci" = false ]; then
            go mod tidy
          fi
        silent: true

  build:
    desc: 编译到 bin/（版本号取根目录 VERSION.txt，可用 APP_VERSION=1.2.3 覆盖）
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags "-s -w -X main.version={{.APP_VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.BUILD_DATE}}" -o {{.BIN_DIR}}/{{.APP_NAME}} ./cmd/server

  dev:
    # 一个入口覆盖三件事：默认热重载、--db 换库、--once 单次、--down 收尾。
    # 原先拆成 dev / dev:once / dev:pg / dev:mysql / dev:down 五条任务，
    # 只是同一套启动流程的排列组合，各自记一遍迟早不一致。
    #
    # 容器由本任务自己拉起：换了数据库的开发环境需要什么，由这一端负责，
    # 不要求使用者先记得去仓库根跑一条 infra 命令。
    desc: 开发启动（默认 SQLite + 内存缓存、air 热重载）；开关：--db=pg|mysql 换库并拉起容器、--once 单次运行不监听、--down 停掉拉起的容器
    env:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      - cmd: |
          set -euf

          db=sqlite
          once=false
          down=false
          # 参数是根目录统一入口原样转进来的：可能带着旁边那个子项目（例如前端）的开关，
          # 所以不认识的参数一律忽略，只挑出本端认识的几个。eval 复原参数边界，
          # 避免 `--db=pg` 带着 Task 加的引号、含空格的参数被拆成两段。
          eval "set -- ${ARGS:-}"
          for arg in "$@"; do
            case "$arg" in
              --db=pg | --db=postgres) db=pg ;;
              --db=mysql) db=mysql ;;
              --db=sqlite) db=sqlite ;;
              --db=*)
                # 本端认的开关，值写错就别偷偷退回默认库：静默换库比报错更难查。
                printf '✗ --db 只支持 pg / mysql，收到：%s\n' "$arg" >&2
                exit 1
                ;;
              --once) once=true ;;
              --down) down=true ;;
            esac
          done

          # 先把容器的事办完：--down 只停容器，不启动服务。
          if [ "$down" = true ]; then
            docker compose -f {{.COMPOSE_FILE}} --profile mysql down
            exit 0
          fi

          config={{.CONFIG_FILE}}
          case "$db" in
            pg)
              config=configs/config.postgres.yaml
              docker compose -f {{.COMPOSE_FILE}} up -d --wait postgres redis
              ;;
            mysql)
              config=configs/config.mysql.yaml
              docker compose -f {{.COMPOSE_FILE}} --profile mysql up -d --wait mysql redis
              ;;
          esac

          mkdir -p data

          # --once：跑一次就退，不监听变更，也不需要 air。
          if [ "$once" = true ]; then
            exec go run ./cmd/server -config "$config"
          fi

          if ! command -v air >/dev/null 2>&1; then
            printf '✗ 未找到 air：先执行 task tool:air（或 go install github.com/air-verse/air@{{.AIR_VERSION}}）\n' >&2
            exit 1
          fi
          # `--` 之后的参数由 air 追加给被启动的二进制。
          exec air -c {{.AIR_CONFIG}} -- -config "$config"
        silent: true

  tool:air:
    desc: 安装 air（版本锁在 vars.AIR_VERSION；走 go install，不进 go.mod）
    cmds:
      - go install github.com/air-verse/air@{{.AIR_VERSION}}

  run:
    desc: 运行已编译的二进制
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}} -config {{.CONFIG_FILE}}

  test:
    desc: 运行单元测试（-race：内存缓存与中间件都有并发路径）
    cmds:
      - go test -race ./... -count=1

  lint:
    # go vet 查不出「写了却没人调用的包级函数」（U1000），那种死代码只能靠人眼扫。
    # staticcheck 补的正是这一层；它比 vet 慢，但也只在 lint 里跑。
    desc: 静态检查（go vet + staticcheck）
    cmds:
      - go vet ./...
      - go run honnef.co/go/tools/cmd/staticcheck@{{.STATICCHECK_VERSION}} ./...

  fmt:
    desc: 格式化代码
    cmds:
      - gofmt -w .

  clean:
    desc: 清理编译产物
    cmds:
      - rm -rf {{.BIN_DIR}}
