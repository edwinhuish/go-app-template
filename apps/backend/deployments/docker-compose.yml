# 后端开发环境需要的容器：PostgreSQL + Redis（MySQL 用 profile 按需启动）。
#
# 这份文件属于本端的开发环境，放在本目录里：换了数据库的开发方式由本端自己负责，
# 不依赖仓库根再维护一份基础设施编排。
#
# 用法（都不需要手动敲 docker 命令，dev 任务会自己拉起）：
#   task dev:pg       # 拉起 postgres + redis，再以 config.postgres.yaml 热重载
#   task dev:mysql    # 拉起 mysql + redis，再以 config.mysql.yaml 热重载
#   task dev:down     # 停掉上面拉起的容器（数据卷保留）
#
# 默认的 task dev 走 SQLite + 内存缓存，不碰这里的任何容器。

services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: app-mysql
    restart: unless-stopped
    profiles: ['mysql']
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-papp']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  mysql-data:
  redis-data:
