version: '3'

# 后端任务。命令只在这里维护一份：仓库根的统一入口按任务名调用本文件
# （`task -d apps/backend <任务>`），本地也可以直接在本目录跑 `task <任务>`。
#
# 工作目录就是 apps/backend，因此 go.mod、.air.toml、configs/ 的路径都相对于本目录。

vars:
  BIN_DIR: bin
  APP_NAME: app-server
  CONFIG_FILE: configs/config.yaml
  AIR_VERSION: v1.67.4
  AIR_CONFIG: .air.toml
  # 本端要用到的容器都在本目录里定义：容器属于本端的开发环境，不放在仓库根。
  COMPOSE_FILE: deployments/docker-compose.yml
  # 版本号正本是仓库根目录的 VERSION，构建期注入：
  # 产物因此能在任何目录用 -version 自证。命令行 task build APP_VERSION=1.2.3 可覆盖。
  #
  # 刻意不叫 VERSION：任务级变量会向上传给调用它的父 Taskfile，
  # 而根目录的 release 任务要用 VERSION 接收用户输入的版本号，同名会被覆盖。
  APP_VERSION:
    sh: tr -d '[:space:]' < ../../VERSION 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: 列出后端可用任务
    silent: true
    cmds:
      - task --list

  install:
    desc: 下载 Go 依赖并整理 go.mod
    cmds:
      - go mod download
      - go mod tidy

  install:ci:
    # 严格模式只下载、不 tidy：tidy 会改写 go.mod / go.sum，
    # 在 CI / 发布流程里那等于悄悄改掉了锁文件。
    desc: 只按 go.mod / go.sum 下载依赖，不修改它们（CI / 发布用）
    cmds:
      - go mod download

  build:
    desc: 编译到 bin/（版本号取根目录 VERSION，可用 APP_VERSION=1.2.3 覆盖）
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags "-s -w -X main.version={{.APP_VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.BUILD_DATE}}" -o {{.BIN_DIR}}/{{.APP_NAME}} ./cmd/server

  dev:
    desc: 热重载启动（air 监听 *.go 变更 → 重新编译 → 自动重启；SQLite + 内存缓存，不依赖容器）
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task tool:air（或 go install github.com/air-verse/air@{{.AIR_VERSION}}）'
    cmds:
      - mkdir -p data
      - air -c {{.AIR_CONFIG}}

  dev:once:
    desc: 单次启动、不监听变更（改启动流程 / 没有 air 时用）
    cmds:
      - mkdir -p data
      - go run ./cmd/server -config {{.CONFIG_FILE}}

  dev:pg:
    # 容器由本任务自己拉起：换了数据库的开发环境需要什么，由这一端自己负责，
    # 不要求使用者先记得去仓库根跑一条 infra 命令。
    desc: 以 PostgreSQL + Redis 热重载启动（自动拉起本端的 postgres / redis 容器）
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task tool:air'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait postgres redis
      # `--` 之后的参数由 air 追加给被启动的二进制。
      - air -c {{.AIR_CONFIG}} -- -config configs/config.postgres.yaml

  dev:mysql:
    desc: 以 MySQL + Redis 热重载启动（自动拉起本端的 mysql / redis 容器）
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task tool:air'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} --profile mysql up -d --wait mysql redis
      - air -c {{.AIR_CONFIG}} -- -config configs/config.mysql.yaml

  dev:down:
    desc: 停止 dev:pg / dev:mysql 拉起的容器（数据卷保留）
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} --profile mysql down

  tool:air:
    desc: 安装 air（版本锁在 vars.AIR_VERSION；走 go install，不进 go.mod）
    cmds:
      - go install github.com/air-verse/air@{{.AIR_VERSION}}

  run:
    desc: 运行已编译的二进制
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}} -config {{.CONFIG_FILE}}

  test:
    desc: 运行单元测试
    cmds:
      - go test ./... -count=1

  lint:
    desc: 静态检查（go vet）
    cmds:
      - go vet ./...

  fmt:
    desc: 格式化代码
    cmds:
      - gofmt -w .

  clean:
    desc: 清理编译产物
    cmds:
      - rm -rf {{.BIN_DIR}}
