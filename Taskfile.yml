version: '3'

# 根目录只做「统一入口」：下面 8 个命令，每个都会把同名任务派发到 apps/ 下所有子项目，
# 子项目没定义就跳过。实现全在 scripts/task-entry.sh —— 根 Taskfile 只做转调，
# 不在 YAML 里再写一遍流程。
#
# 为什么不用 includes：include 要把每一端写死在根文件里（新增一端得回来改），
# 暴露的也是 backend:build / frontend:build 这类命名空间任务。现在运行时遍历
# apps/*/Taskfile.y*ml，加一个新端不需要动根目录任何文件。
#
# 参数写在 `--` 之后（Task 自己的参数解析不接受裸 --ci / --no-fmt），解析规则只有两条：
#   第一个不以 -- 开头的参数 = 子项目名，只在那一个子项目里执行；以 -- 开头的是命令开关。
#   task install -- --ci              # 所有子项目，严格按锁文件
#   task install -- backend           # 只装 apps/backend
#   task install -- backend --ci      # 子项目名 + 开关组合
#   task lint  -- frontend --no-fmt   # 只检查前端，不格式化
#   task dev   -- backend             # 只起后端（前台跑）
#
# 单个端的任务也可以直接对那一端执行（不看这里的参数规则）：
#   task -d apps/backend dev -- --db=pg
#
# 忘了有哪些命令：task help（不带任务名也一样，见下面 default 的说明）。

tasks:
  help:
    desc: 列出全部命令（等价于直接跑 task）
    silent: true
    cmds:
      - task --list

  # 不带任务名时落到这里，等价于 `task help`。
  # 刻意不写 desc：description 是 --list 的筛选条件，写了它就会在帮助里多占一行
  # （`default` 是 Task 的内置名字，不该出现在对外暴露的命令清单里）。
  # 用 cmds 转调而不是 `task: help`：后者在 silent 下会把输出一起吞掉。
  default:
    silent: true
    cmds:
      - task help

  install:
    desc: 装依赖（task install -- --ci：严格按锁文件，锁文件与 package.json 不一致直接失败）
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh install "$TASK_ARGS"'

  build:
    desc: 构建所有子项目的产物
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh build "$TASK_ARGS"'

  clean:
    desc: 清理所有子项目的构建产物
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh clean "$TASK_ARGS"'

  dev:
    # interactive：几端的开发进程都要直连终端，否则 Ctrl-C 与热重载的输出都不对。
    desc: 并行启动所有子项目的开发环境（Ctrl-C 一并退出）
    silent: true
    interactive: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh dev "$TASK_ARGS"'

  lint:
    desc: 格式化并检查所有子项目（task lint -- --no-fmt：只检查不格式化）
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh lint "$TASK_ARGS"'

  fmt:
    desc: 格式化所有子项目代码
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh fmt "$TASK_ARGS"'

  test:
    desc: 运行所有子项目的测试
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh test "$TASK_ARGS"'

  release:
    # 发版仍是本地的一串动作（问版本号 -> 同步版本号 -> 提交、打 tag -> 问是否推送），
    # 逻辑在 scripts/release.sh：那里能按顺序校验工作区、远程与 tag 是否被占用。
    # 子项目若自己定义了 release 任务，会先跑它（见 scripts/task-entry.sh）。
    desc: 打版本 tag 并发版（会先问版本号；VERSION=1.2.3 REMOTE=origin PUSH=false DRY_RUN=true）
    silent: true
    interactive: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
      VERSION: '{{.VERSION | default ""}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
      PUSH: '{{.PUSH | default "ask"}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    cmds:
      - 'scripts/task-entry.sh release "$TASK_ARGS"'
