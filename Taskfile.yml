version: '3'

# 两套入口，靠**位置**分辨，不靠猜参数：
#
#   1. 单个端：task <子项目>:<命令> [-- 参数...]
#        Task 原生 includes：任务名里带命名空间，参数直接进那一端的任务，
#        根目录一行脚本都不参与，因此没有任何解析与改写。
#          task server:build
#          task server:dev -- --db=pg --once
#          task server:test -- -run TestLogin      # 位置参数也能传
#
#   2. 所有端：task <命令> [-- 参数...]
#        根目录的 8 个统一命令：逐个跑 apps/ 下每个子项目的同名任务（没定义就跳过），
#        同一份参数原样转给每一个，根不校验、不过滤。7 个业务命令走的是同一段逻辑，
#        没有按命令特判的分支。
#          task build
#          task install -- --ci
#          task test -- -run TestLogin
#
# 为什么 app 名不做成位置参数：`task release -- 1.2.3`、`task test -- TestLogin` 这类
# 裸词的归属永远说不清（是 app？是版本号？是测试名？），而错判的后果是静默跑全部。
# 把 app 放进**任务名**里，裸词就只剩下"业务参数"一种身份。
#
# includes 必须静态列出（Task 不支持通配符包含）：新增一个子项目 = 在这张表里加 4 行。
includes:
  server:
    taskfile: ./apps/server/Taskfile.yml
    dir: ./apps/server
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web

# 全局命令的参数写在 `--` 之后（Task 自己的参数解析不接受裸 --ci / --db=pg），
# 由根 Taskfile 放进 TASK_ARGS 环境变量交给 scripts/task-entry.sh。
# 不拼成字符串当 argv：那样含空格的参数会被拆开、含 = 的会被一层层加引号。
#
# 忘了有哪些命令：task help（不带任务名也一样，见下面 default 的说明）。

tasks:
  help:
    desc: 列出全部命令（等价于直接跑 task）
    silent: true
    cmds:
      - task --list

  # 不带任务名时落到这里，等价于 `task help`。
  # 刻意不写 desc：description 是 --list 的筛选条件，写了它就会在帮助里多占一行
  # （`default` 是 Task 的内置名字，不该出现在对外暴露的命令清单里）。
  # 用 cmds 转调而不是 `task: help`：后者在 silent 下会把输出一起吞掉。
  default:
    silent: true
    cmds:
      - task help

  # 下面每个命令都只做一件事：把 CLI_ARGS 放进 TASK_ARGS 环境变量，再把命令名交给脚本。
  # 参数不拼进 argv（含空格的参数会被拆开、含 = 的会被反复加引号），脚本里 eval 复原边界后
  # 原样转给子项目。根不校验内容，认不认识由各端自己决定。

  install:
    desc: 装依赖（task install -- --ci：严格按锁文件，锁文件与 package.json 不一致直接失败）
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh install'

  build:
    desc: 构建所有子项目的产物
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh build'

  clean:
    desc: 清理所有子项目的构建产物
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh clean'

  dev:
    # interactive：开发进程要直连终端，否则 Ctrl-C 与热重载的输出都不对。
    # 逐个起：第一个端是长驻进程，它会一直占着终端，后面的端不会被执行。
    # 多端同时开发请各开一个终端跑 `task server:dev` / `task web:dev`。
    desc: 逐个启动所有子项目的开发环境（第一个长驻端会占住终端；多端用 task <端>:dev）
    silent: true
    interactive: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh dev'

  lint:
    desc: 检查所有子项目（格式化是 task fmt，不在这里顺手做）
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh lint'

  fmt:
    desc: 格式化所有子项目代码
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh fmt'

  test:
    desc: 运行所有子项目的测试
    silent: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - 'scripts/task-entry.sh test'

  release:
    # 发版仍是本地的一串动作（问版本号 -> 同步版本号 -> 提交、打 tag -> 问是否推送），
    # 逻辑在 scripts/release.sh：那里能按顺序校验工作区、远程与 tag 是否被占用。
    # 子项目若自己定义了 release 任务，会先跑它（见 scripts/task-entry.sh）。
    desc: 打版本 tag 并发版（task release -- 1.2.3 --dry-run；也认 VERSION= / REMOTE= / PUSH= / DRY_RUN= 环境变量）
    silent: true
    interactive: true
    env:
      TASK_ARGS: '{{.CLI_ARGS}}'
      VERSION: '{{.VERSION | default ""}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
      PUSH: '{{.PUSH | default "ask"}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    cmds:
      - 'scripts/task-entry.sh release'
